name: GPU integration
on:
  workflow_dispatch:
    inputs:
      cupy_package:
        description: CuPy wheel matching the runner's CUDA installation
        required: true
        default: cupy-cuda12x
        type: choice
        options: [cupy-cuda12x, cupy-cuda13x]
permissions:
  contents: read
jobs:
  gpu:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 20
    env:
      GPU_VENV: .gpu-venv-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv "$GPU_VENV"
      - run: '"$GPU_VENV/bin/python" -m pip install -e ".[test,xarray]" "dask[array]" "$CUPY_PACKAGE"'
        env:
          CUPY_PACKAGE: ${{ inputs.cupy_package }}
      - name: Require a working CUDA device
        run: '"$GPU_VENV/bin/python" -c "import cupy as cp; assert cp.cuda.runtime.getDeviceCount() > 0"'
      - run: '"$GPU_VENV/bin/python" -m pytest -q tests/test_device.py tests/test_xarray.py'
        env:
          MPLBACKEND: Agg
      - run: '"$GPU_VENV/bin/python" examples/22_cpu_gpu.py && "$GPU_VENV/bin/python" examples/23_xarray_blocks.py'
