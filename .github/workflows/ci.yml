name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        numpy: ["numpy<2", "numpy>=2"]
        exclude:
          # NumPy 1.x ships no wheels for 3.13+: pip would build it and a matching
          # SciPy from source, which is slow and needs OpenBLAS the runner lacks
          - python: "3.13"
            numpy: "numpy<2"
          - python: "3.14"
            numpy: "numpy<2"
          - python: "3.15"
            numpy: "numpy<2"
        include:
          - os: windows-latest
            python: "3.12"
            numpy: "numpy>=2"
          - os: macos-latest
            python: "3.12"
            numpy: "numpy>=2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -U pip "${{ matrix.numpy }}" -e ".[test,perf,zmq,xarray]" "dask[array]"
        env:
          MPLBACKEND: Agg
      - run: python -m pytest -q tests examples/18_testing_pipelines.py
        env:
          MPLBACKEND: Agg
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pyright  # the optional imports must resolve
      - run: mypy src/sigflow tests examples
      - run: pyright
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[notebook]" nbconvert
      - run: python -m pip install -U pytest
      - run: for f in examples/[0-9]*.py; do echo "== $f"; python "$f" > /dev/null || exit 1; done
        env:
          MPLBACKEND: Agg
      - run: cd examples && python make_notebook.py && jupyter nbconvert --to notebook --execute sigflow_tour.ipynb --output /tmp/tour.ipynb
        env:
          MPLBACKEND: Agg
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: python docs/build_docs.py && mkdocs build --strict
