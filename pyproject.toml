[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigflow"
version = "0.3.0"
description = "Typed, functional, generator-based signal-processing graphs for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
notebook = ["ipython", "jupyter", "ipywidgets"]
test = ["pytest"]
perf = ["greenlet"] # sync generator stream blocks run inline on the event loop
zmq = ["pyzmq"] # io.zmq / io.zmq_sink
docs = ["mkdocs-material", "pytest"] # python docs/build_docs.py && mkdocs build
dev = [
  "pytest",
  "mypy",
  "ipywidgets",
  "jupyter",
  "nbconvert",
  "greenlet",
  "pyzmq",
  "mkdocs-material",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sigflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Sig[...] reads as np.ndarray to checkers (see types.py); the symbolic dimension
# strings ("N") and tuple return annotations are the DSL parts they cannot read.
# A block's return annotation is a *contract* (Sig[float, ()] may be returned as a
# float, Sig[dict] as a dict, any output as a Frame), not the body's Python return
# type, so return-value checking is off for the package.
disable_error_code = [
  "name-defined",
  "valid-type",
  "misc",
  "type-arg",
  "syntax",
  "has-type",
  "return-value",
]
