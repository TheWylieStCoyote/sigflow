[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigflow"
version = "0.5.0"
description = "Typed, functional, generator-based signal-processing graphs for Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
notebook = ["ipython", "jupyter", "ipywidgets"]
test = ["pytest"]
perf = ["greenlet"] # sync generator stream blocks run inline on the event loop
zmq = ["pyzmq"] # io.zmq / io.zmq_sink
cupy = ["cupy"] # optional CUDA transfers; CUDA-specific wheels may be installed separately
xarray = ["xarray"] # labelled DataArray payloads: @block(labels=True), default_labels()
docs = ["mkdocs-material", "pytest"] # python docs/build_docs.py && mkdocs build
dev = [
  "pytest",
  "mypy",
  "ipywidgets",
  "jupyter",
  "nbconvert",
  "greenlet",
  "pyzmq",
  "xarray",
  "dask[array]",
  "mkdocs-material",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sigflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
mypy_path = "src"             # resolve sigflow from this checkout, installed or not

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests", "examples"]
extraPaths = [
  "src",
] # resolve sigflow from this checkout, whatever interpreter is selected
reportMissingModuleSource = false
