[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigflow"
version = "0.4.0"
description = "Typed, functional, generator-based signal-processing graphs for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
notebook = ["ipython", "jupyter", "ipywidgets"]
test = ["pytest"]
perf = ["greenlet"] # sync generator stream blocks run inline on the event loop
zmq = ["pyzmq"] # io.zmq / io.zmq_sink
docs = ["mkdocs-material", "pytest"] # python docs/build_docs.py && mkdocs build
dev = [
  "pytest",
  "mypy",
  "ipywidgets",
  "jupyter",
  "nbconvert",
  "greenlet",
  "pyzmq",
  "mkdocs-material",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sigflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# The Sig[...] DSL puts runtime values (dimension strings, shape tuples) where a
# checker expects types, and a block's return annotation is a contract rather than
# the body's Python return type. Until the DSL is spelled in checker-readable form
# (planned for 0.5.0) the modules written in it carry these exemptions; the core
# (graph, runtime, frame, builder, ratio, persist, ...) is checked in full.
[[tool.mypy.overrides]]
module = ["sigflow.dsp", "sigflow.linalg", "sigflow.io", "sigflow.plot", "sigflow.types"]
disable_error_code = ["name-defined", "valid-type", "misc", "syntax", "return-value"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "tests", "examples"]
reportMissingModuleSource = false
# The same five modules carry a "# pyright:" header line. Tests and examples are
# written in the DSL too, so they get the same exemptions by directory, plus the
# two Optional rules that `Frame.prov: Provenance | None` trips on every lineage
# access (to be addressed with the DSL in 0.5.0). CI gates `pyright src` only.
executionEnvironments = [
  { root = "tests", reportUndefinedVariable = false, reportInvalidTypeForm = false, reportReturnType = false, reportGeneralTypeIssues = false, reportOptionalMemberAccess = false, reportOptionalSubscript = false },
  { root = "examples", reportUndefinedVariable = false, reportInvalidTypeForm = false, reportReturnType = false, reportGeneralTypeIssues = false, reportOptionalMemberAccess = false, reportOptionalSubscript = false },
  { root = "src" },
]
